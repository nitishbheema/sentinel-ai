version: '3.8'

networks:
  sentinel_internal:
    driver: bridge
    internal: true
  sentinel_public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  zeek_logs:
  suricata_logs:
  certbot_certs:
  certbot_www:

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinelai_postgres
    restart: unless-stopped
    networks:
      - sentinel_internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-sentinelai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  redis:
    image: redis:7-alpine
    container_name: sentinelai_redis
    restart: unless-stopped
    networks:
      - sentinel_internal
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelai_backend
    restart: unless-stopped
    networks:
      - sentinel_internal
      - sentinel_public
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinelai_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_ENABLED=True
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://sentinel-ai.pages.dev}
      - AGENT_SHARED_SECRET=${AGENT_SHARED_SECRET:?AGENT_SHARED_SECRET must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1536M

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelai_worker
    restart: unless-stopped
    networks:
      - sentinel_internal
    command: ["python", "-m", "app.workers.processor"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinelai_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_ENABLED=True
      - AGENT_SHARED_SECRET=${AGENT_SHARED_SECRET:?AGENT_SHARED_SECRET must be set in .env}
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M

  reverse-proxy:
    image: nginx:alpine
    container_name: sentinelai_nginx
    restart: unless-stopped
    networks:
      - sentinel_public
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
