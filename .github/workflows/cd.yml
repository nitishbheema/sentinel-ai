name: SentinelAI CD Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL || '/api/v1' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'sentinel-ai'
          directory: 'frontend/dist'

  deploy-backend:
    name: Deploy Backend & Core to Oracle Cloud
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: ${{ secrets.OCI_VM_HOST != '' && secrets.OCI_SSH_KEY != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.OCI_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via Docker Compose on OCI VM
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.OCI_VM_USER || 'ubuntu' }}@${{ secrets.OCI_VM_HOST }} 'bash -s' << 'EOF'
            set -e
            cd /opt/sentinelai || git clone https://github.com/${{ github.repository }} /opt/sentinelai
            cd /opt/sentinelai
            git pull origin main || git pull origin master
            docker compose pull || true
            docker compose up -d --build
            docker compose exec -T backend alembic upgrade head
            echo "SentinelAI deployment refreshed successfully."
          EOF
